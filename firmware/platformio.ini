; PlatformIO Project Configuration File
;
;   Build options: build flags, source filter
;   Upload options: custom upload port, speed and extra flags
;   Library options: dependencies, extra library storages
;   Advanced options: extra scripting
;
; Please visit documentation for the other options and examples
; https://docs.platformio.org/page/projectconf.html

[env:teensy41]
platform = teensy
board = teensy41
framework = arduino
monitor_speed = 1000000
build_flags =
    -Wall
    -Wextra
    ; Dual USB-CDC: `Serial` keeps the ASCII command/TRIG protocol,
    ; `SerialUSB1` carries the one-way binary telemetry stream (IMU, heartbeat).
    -D USB_DUAL_SERIAL
lib_deps =
    ; BMI088 accel+gyro driver (SPI), pinned for reproducible builds.
    bolderflight/Bolder Flight Systems BMI088@^1.0.1
